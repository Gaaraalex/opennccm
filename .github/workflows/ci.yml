name: Pruebas

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Revisión de código
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC1091,SC2015 install.sh scripts/opennccm.sh rollback-update.sh tests/*.sh
      - name: pyflakes
        run: |
          python3 -m pip install -q pyflakes
          python3 -m pyflakes app tests

  app:
    name: Aplicación (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Pruebas de extremo a extremo (router Cisco simulado)
        run: bash tests/run-tests.sh .venv/bin/python
      - name: Equipos antiguos (OpenSSH real con solo ssh-rsa y kex SHA-1)
        run: bash tests/legacy-openssh-test.sh .venv/bin/python

  directories:
    name: Directorios reales (Samba AD y Keycloak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Inicio de sesión con Active Directory (Samba AD) y OpenID Connect (Keycloak)
        run: bash tests/directories-test.sh .venv/bin/python

  linux:
    name: Servidores Linux reales (Ubuntu 26.04, 24.04, 22.04 y Debian 13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Respaldar servidores Ubuntu y Debian por SSH (contenedores oficiales)
        run: bash tests/linux-real-test.sh .venv/bin/python

  zabbix:
    name: Importar desde Zabbix real (${{ matrix.zabbix }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zabbix: ["6.0", "7.0", "7.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: Zabbix ${{ matrix.zabbix }} oficial (PostgreSQL, servidor e interfaz web) e importación en OpenNCCM
        run: bash tests/zabbix-real-test.sh ${{ matrix.zabbix }} .venv/bin/python

  install:
    name: Instalación y actualización (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalación desatendida (curl | bash)
        run: cat install.sh | sudo bash -s -- --unattended --source "$GITHUB_WORKSPACE" --host 127.0.0.1 --admin-pass 'Admin12345' --no-upgrade
      - name: Verificar la instalación
        run: |
          curl -fsk https://127.0.0.1/healthz
          curl -fsk https://127.0.0.1/login | grep -q "OpenNCCM"
          sudo opennccm status
          systemctl is-active opennccm nginx
          sudo ss -lunp | grep -q ':514 '
      - name: Certificado propio, cookie segura y consola SSH por nginx
        run: bash tests/install-checks.sh tls
      - name: Cambiar zona horaria y NTP desde la interfaz (servicio sin root + polkit)
        run: bash tests/time-test.sh
      - name: Repetir el instalador detecta la instalación existente
        run: sudo bash install.sh --unattended | tee /tmp/out.txt && grep -q "ya está instalado" /tmp/out.txt
      - name: Actualización, vuelta atrás y recuperación automática
        run: sudo bash tests/update-test.sh "$GITHUB_WORKSPACE"
      - name: Actualizar desde el botón de la web (systemd)
        run: bash tests/install-checks.sh webupdate
      - name: Registros (si falla)
        if: failure()
        run: |
          sudo tail -n 120 /var/log/opennccm-install.log || true
          sudo journalctl -u opennccm -n 120 --no-pager || true

  package:
    name: Instalación desde paquete .tar.gz (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar desde el paquete (sin historial git)
        run: |
          mkdir -p /tmp/pkg
          git archive --format=tar.gz --prefix=opennccm/ -o /tmp/pkg/opennccm.tar.gz HEAD
          cd /tmp/pkg && tar xzf opennccm.tar.gz && cd opennccm
          sudo bash install.sh --unattended --source "$(pwd)" --host 127.0.0.1 --admin-pass 'Admin12345' --no-upgrade
      - name: Verificar
        run: |
          curl -fsk https://127.0.0.1/healthz
          sudo opennccm status | tee /tmp/status.txt
          if grep -qF '(?)' /tmp/status.txt; then echo 'opennccm status muestra «(?)»'; exit 1; fi
          test "$(sudo git -C /opt/opennccm remote get-url origin)" = "https://github.com/Gaaraalex/opennccm.git"
          sudo grep -q "REPO_URL='https://github.com/Gaaraalex/opennccm.git'" /etc/opennccm/install.conf
      - name: Registro (si falla)
        if: failure()
        run: sudo tail -n 120 /var/log/opennccm-install.log || true

  tui:
    name: Asistente con menús (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar como una persona (tmux + whiptail, usuario normal con sudo)
        run: |
          sudo apt-get install -y -qq tmux
          python3 tests/tui_drive.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/capturas"
      - name: Verificar
        run: |
          curl -fsk https://127.0.0.1/healthz
          jar=$(mktemp)
          dest=$(curl -s -c "$jar" -b "$jar" -o /dev/null -w '%{redirect_url}' -d 'username=admin&password=Admin12345' http://127.0.0.1:8000/login)
          test "$dest" = "http://127.0.0.1:8000/"
      - name: Capturas de pantalla del asistente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-asistente
          path: ${{ runner.temp }}/capturas
      - name: Registro (si falla)
        if: failure()
        run: sudo tail -n 120 /var/log/opennccm-install.log || true

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, app, directories, linux, zabbix, install, package, tui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER=${TAG#v}
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notas.md
          printf '\n### Instalar\n```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/main/install.sh -o install.sh && sudo bash install.sh\n```\n### Actualizar una instalación existente\n```bash\nsudo opennccm update\n```\n' "$GITHUB_REPOSITORY" >> notas.md
          git archive --format=tar.gz --prefix=opennccm/ -o "opennccm-$VER.tar.gz" "$TAG"
          gh release create "$TAG" --title "OpenNCCM $VER" --notes-file notas.md \
            "opennccm-$VER.tar.gz" docs/*.pdf
