{% extends "base.html" %}{% block title %}Aplicando zona horaria{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:8vh auto;text-align:center">
  <h1 style="margin-bottom:8px">Aplicando la zona horaria {{ tz }}…</h1>
  <p class="muted">OpenNCCM se está reiniciando para usar la nueva hora. Esta página se recargará sola en unos segundos.</p>
  <p id="estado" class="small muted">Esperando al servicio…</p>
  <p><a class="btn sec" href="/system#hora">Volver a Sistema</a></p>
</div>
<script>
(function () {
  var tries = 0, el = document.getElementById('estado');
  function check() {
    tries++;
    fetch('/healthz', {cache: 'no-store'}).then(function (r) {
      if (r.ok && tries > 3) { location.href = '/system#hora'; } else { setTimeout(check, 1500); }
    }).catch(function () { el.textContent = 'Reiniciando… (' + tries + ')'; setTimeout(check, 1500); });
  }
  setTimeout(check, 2000);
})();
</script>
{% endblock %}
