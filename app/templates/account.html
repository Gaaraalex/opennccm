{% extends "base.html" %}{% block title %}Mi cuenta{% endblock %}
{% block content %}
<h1>Mi cuenta</h1>
<div class="card" style="max-width:420px">
  <form method="post">
    <label>Contraseña actual</label><input type="password" name="current" required>
    <label>Nueva contraseña (mín. 8)</label><input type="password" name="new" required minlength="8">
    <p><button>Cambiar contraseña</button></p>
  </form>
</div>
{% endblock %}
