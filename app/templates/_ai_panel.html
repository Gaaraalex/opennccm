{# Panel del asistente IA dentro de la consola (lo arma app/static/assistant.js; el logo va en la plantilla de abajo). #}
<template id="ai-logo">{{ ai_logo(ai.provider, 36) }}</template>
<aside class="ai-panel" id="ai-panel" hidden aria-label="{{ _('Asistente de red') }}"
  data-device="{{ dev.id }}" data-kind="console" data-name="{{ dev.name }}" data-os="{{ profile.label or dev.os }}"
  data-t='{{ {'title': _('Asistente de red'), 'cloud': _('nube'), 'change': _('Cambiar'), 'hello': _f('Hola. Tengo el contexto de {0}: {1}. Pregúntame qué comando usar o pídeme que explique una salida.', dev.name, (dev.model ~ ' · ' if dev.model else '') ~ dev.os),
    'backup': _('respaldo'), 'console': _('salida de la consola'), 'secrets': _('secretos ocultos'), 'sugg': _('PREGUNTAS SUGERIDAS'), 'ph': _('Pregunta al asistente…'),
    'note': _('Sugiere; nunca ejecuta. Antes de enviar se ocultan contraseñas y claves. Cada pregunta queda en Auditoría.'),
    'thinking': _('Pensando…'), 'copy': _('Copiar'), 'insert': _('Insertar'), 'cr': _('Enviar como solicitud de cambio'), 'copied': _('Copiado.'),
    'wshort': _('Revisa los comandos antes de usarlos en producción.'), 'forum': _('Foro'), 'forum_url': FORUM_URL, 'issues_url': ISSUES_URL,
    'risk': {'read': _('solo lectura'), 'change': _('cambia la configuración'), 'outage': _('corta el servicio')}, 'source': _('Fuente: {0}'),
    'crdone': _('Solicitud de cambio creada.'), 'close': _('Cerrar'), 'send': _('Enviar'),
    'hide': _('Ocultar'), 'model': _('Modelo'), 'sugtog': _('Preguntas sugeridas'), 'head': _('Mostrar u ocultar los detalles'), 'modelset': _('Ahora usa {0}.')}|tojson }}'></aside>
